name: nf-core release announcements

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Each channel (Mastodon, Bluesky) is independently optional: a missing
# secret pair skips that channel with a logged notice, it does not fail.

on:
  release:
    types: [published]

permissions: {}

jobs:
  announce:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/release-announcements.yml@main
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
