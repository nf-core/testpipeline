name: nf-test

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# All shard discovery, matrix setup, and reporting logic now lives there;
# see .nf-core.yml's `ci:` block for the settings this pipeline overrides.

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/nf-test.yml@main
    secrets:
      SENTIEON_LICSRVR_IP: ${{ secrets.SENTIEON_LICSRVR_IP }}
      SENTIEON_LICENSE_MESSAGE: ${{ secrets.SENTIEON_LICENSE_MESSAGE }}
      SENTIEON_ENCRYPTION_KEY: ${{ secrets.SENTIEON_ENCRYPTION_KEY }}
