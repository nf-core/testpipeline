name: nf-core clean-up

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# `schedule` stays here: workflow_call has no schedule trigger of its own
# to inherit. The shared workflow skips forks automatically.

on:
  schedule:
    - cron: "0 0 * * 0" # Once a week

permissions: {}

jobs:
  run:
    permissions:
      issues: write
      pull-requests: write
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/clean-up.yml@main
