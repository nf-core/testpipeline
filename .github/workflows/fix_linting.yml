name: fix-linting

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Splits the "@nf-core-bot fix linting" command into three jobs
# (acknowledge / prepare-fix / push-fix) so the bot's push credential is
# never in the same job as the pull request's own untrusted lint hooks.

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}

permissions: {}

jobs:
  fix-linting:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/fix-linting.yml@main
    secrets:
      BOT_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
