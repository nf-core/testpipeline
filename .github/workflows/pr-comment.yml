name: pr-comment

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# This is the single privileged comment poster: it downloads the
# pr-comment artifact from the producer run that triggered it and never
# checks out or executes any pull-request code itself.
#
# `workflows:` below names each producer by its own `name:` field, not by
# filename. Keep it in sync with the stubs below when adding a new producer.

on:
  workflow_run:
    workflows:
      - "nf-core linting"
      - "nf-test"
      - "nf-core template version comment"
      - "nf-core branch protection"
    types: [completed]

permissions: {}

jobs:
  post-comment:
    permissions:
      actions: read
      pull-requests: write
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/pr-comment.yml@main
