name: nf-core branch protection

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Checks that a PR into main/master comes from dev or a patch branch, and
# writes a pr-comment artifact for pr-comment.yml to post on failure.

on:
  pull_request:
    branches:
      - main
      - master

permissions: {}

jobs:
  run:
    permissions: {}
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/branch.yml@main
