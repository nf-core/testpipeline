name: nf-core download

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Downloads the pipeline with `nf-core pipelines download`, runs it, and
# fails if the run fetched anything not already cached offline.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Pipeline revision (branch, tag, or commit) to test."
        required: true
        default: "dev"
  pull_request:
    branches:
      - main
      - master

permissions: {}

jobs:
  download:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/download-pipeline.yml@main
    with:
      revision: ${{ github.event.inputs.revision || 'dev' }}
