name: nf-core AWS test

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Manual only: launches the -profile 'test' run on Seqera Platform.

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/awstest.yml@main
    secrets:
      TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
