name: nf-core AWS full size tests

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Gates a launch behind authorize-launch: a configurable number of distinct,
# trusted review approvals (read via the API, not just `review.state`), and
# always launches 'dev', never the reviewed PR's own commits.

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/awsfulltest.yml@main
    secrets:
      TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
