name: nf-core template version comment

# Stub that delegates to the centralized nf-core/actions reusable workflow.
#
# SECURITY: runs on `pull_request` (not `pull_request_target`), read-only,
# no secrets. It only ever writes a pr-comment artifact; pr-comment.yml
# posts it separately, from a privileged job that never runs PR code.

on:
  pull_request:

permissions: {}

jobs:
  run:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/template-version-comment.yml@main
