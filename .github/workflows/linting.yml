name: nf-core linting

# Stub that delegates to the centralized nf-core/actions reusable workflow.
# Runs prek hooks, `nf-core pipelines lint`, and (opt-in via .nf-core.yml)
# `nextflow lint` as jobs inside that shared workflow.

on:
  pull_request:
  push:
    branches: [master, main, dev]
  release:
    types: [published]

permissions: {}

jobs:
  run:
    permissions:
      contents: read
    # Integration-testing nf-core/actions against this fork: pinned to @main
    # while that repo works toward its first release. TODO: switch to a
    # major version tag (e.g. @v1) once nf-core/actions cuts one.
    uses: nf-core/actions/.github/workflows/linting.yml@main
